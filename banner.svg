    </style>
  </defs>

  <!-- No background rect. Transparent background so it perfectly matches the GitHub theme (light or dark) without any seams -->

  <!-- Large Typographic Name -->
  <text x="0" y="200" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="120" letter-spacing="-6" class="primary">RYAN LUKAS</text>
  
  <!-- Minimalist Subtitle -->
  <text x="8" y="260" font-family="'Inter', system-ui, sans-serif" font-weight="300" font-size="28" letter-spacing="-0.5" class="secondary">Software Developer. Product Builder.</text>

