<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;800&amp;display=swap');
      
      .primary { fill: #111111; }
      .secondary { fill: #777777; }
      .cat-path { stroke: #111111; }
      .cat-fill { fill: #111111; }
      
      @media (prefers-color-scheme: dark) {
        .primary { fill: #F0F6FC; }
        .secondary { fill: #8B949E; }
        .cat-path { stroke: #F0F6FC; }
        .cat-fill { fill: #F0F6FC; }
