<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .grid { stroke: #E5E5E5; }
      .accent { stroke: #111111; }
      .text-primary { fill: #111111; }
      .text-secondary { fill: #666666; }
      .text-muted { fill: #999999; }
      .cat { stroke: #111111; }
      .cat-fill { fill: #111111; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0D1117; } /* GitHub native dark background */
        .grid { stroke: #21262D; }
        .accent { stroke: #C9D1D9; }
        .text-primary { fill: #C9D1D9; }
        .text-secondary { fill: #8B949E; }
        .text-muted { fill: #484F58; }
        .cat { stroke: #C9D1D9; }
        .cat-fill { fill: #C9D1D9; }
      }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke-width="0.5" class="grid"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" class="bg"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- Left Accent Line -->
  <line x1="0" y1="0" x2="0" y2="280" stroke-width="8" class="accent"/>

  <!-- Main Typography -->
  <!-- Name -->
  <text x="60" y="110" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" class="text-primary">RYAN</text>
  
  <!-- Role -->
  <text x="62" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="3" class="text-secondary">PRODUCT ENGINEER</text>

  <!-- Sub-description -->
  <text x="62" y="195" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2" class="text-muted">Building systems, internal tools,</text>
  <text x="62" y="218" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2" class="text-muted">and automated workflows.</text>

  <!-- Minimalist Cat -->
  <g transform="translate(820, 100) scale(0.6)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="cat">
    <path d="M68 48 L64 18 L94 36"/>
    <path d="M132 48 L136 18 L106 36"/>
    <path d="M100 34 C126 34 141 52 141 72 C141 92 124 106 100 106 C76 106 59 92 59 72 C59 52 74 34 100 34 Z"/>
    <path d="M70 100 C52 126 47 164 58 178 L142 178 C153 164 148 126 130 100"/>
    <path d="M78 178 C74 168 82 162 90 166"/>
    <path d="M122 178 C126 168 118 162 110 166"/>
    <path d="M142 178 C176 180 186 150 172 132 C165 123 154 124 152 132"/>
    <path d="M83 68 C85 63 91 63 93 68"/>
    <path d="M107 68 C109 63 115 63 117 68"/>
    <path d="M96 80 L104 80 L100 85 Z" class="cat-fill"/>
    <path d="M100 85 C100 91 95 92 92 89"/>
    <path d="M100 85 C100 91 105 92 108 89"/>
    <g stroke-width="2" stroke-opacity="0.5">
      <path d="M56 76 L26 70"/>
      <path d="M56 84 L28 86"/>
      <path d="M144 76 L174 70"/>
      <path d="M144 84 L172 86"/>
    </g>
  </g>
  
  <!-- Subtle coordinate or serial number for tech editorial feel -->
  <text x="890" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" class="text-muted">SYS.REQ.01</text>
  <text x="890" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" class="text-muted">EST. 2023</text>
</svg>
