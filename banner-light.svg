<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Ryan Lukas</title>
  <desc id="desc">Full-stack developer e product builder. Um gatinho de traço fino sentado ao lado do nome.</desc>
  <style>
    :root { --bg:#ffffff; --card:#ffffff; --fg:#141414; --muted:#57606a; --line:#d0d7de; --dot:#e8ebef; --accent:#c98a00; }
    .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }

    .up { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .2s; } .d3 { animation-delay: .35s; } .d4 { animation-delay: .5s; } .d5 { animation-delay: .65s; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .cursor { animation: blinkc 1.1s steps(1) infinite; }
    @keyframes blinkc { 50% { fill-opacity: 0; } }

    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }

    .tail { transform-box: view-box; transform-origin: 1024px 322px; animation: wag 2.6s ease-in-out infinite; }
    @keyframes wag { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(6deg); } }

    .float { animation: float 4s ease-in-out infinite; }
    .float.b { animation-duration: 5s; animation-delay: -2s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
    .twinkle.b { animation-delay: -1.4s; }
    @keyframes twinkle { 0%, 100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="var(--dot)" />
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="var(--card)" stop-opacity="1" />
      <stop offset=".55" stop-color="var(--card)" stop-opacity=".2" />
      <stop offset="1" stop-color="var(--card)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- cartão -->
  <rect x="1" y="1" width="1198" height="378" rx="18" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="378" rx="18" fill="url(#dots)" />
  <rect x="1" y="1" width="1198" height="378" rx="18" fill="url(#fade)" />

  <!-- texto -->
  <g class="up d1">
    <text x="72" y="96" class="mono" font-size="18" fill="var(--muted)">~/goiânia <tspan fill="var(--accent)">$</tspan> whoami<tspan class="cursor" fill="var(--accent)"> ▍</tspan></text>
  </g>

  <g class="up d2">
    <text x="66" y="204" class="sans" font-size="104" font-weight="900" letter-spacing="-2" fill="var(--fg)" textLength="640" lengthAdjust="spacingAndGlyphs">RYAN LUKAS</text>
  </g>

  <g class="up d3">
    <rect x="72" y="226" width="56" height="6" rx="3" fill="var(--accent)" />
  </g>

  <g class="up d4">
    <text x="72" y="274" class="sans" font-size="26" fill="var(--muted)">Full-stack developer <tspan fill="var(--accent)">·</tspan> Product builder</text>
  </g>

  <g class="up d5 mono" font-size="15" fill="var(--fg)" text-anchor="middle">
    <rect x="72" y="302" width="108" height="32" rx="16" fill="none" stroke="var(--line)" stroke-width="1.5" />
    <text x="126" y="323">web apps</text>
    <rect x="192" y="302" width="164" height="32" rx="16" fill="none" stroke="var(--line)" stroke-width="1.5" />
    <text x="274" y="323">sistemas &amp; CRM</text>
    <rect x="368" y="302" width="118" height="32" rx="16" fill="none" stroke="var(--line)" stroke-width="1.5" />
    <text x="427" y="323">automação</text>
  </g>

  <!-- enfeites -->
  <g class="float"><text x="812" y="118" class="mono" font-size="22" fill="var(--accent)" opacity=".9">&lt;/&gt;</text></g>
  <g class="float b"><text x="1096" y="168" class="mono" font-size="22" fill="var(--muted)">{ }</text></g>
  <g transform="translate(1076 84)"><path class="twinkle" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9 Z" fill="var(--accent)" /></g>
  <g transform="translate(860 238)"><path class="twinkle b" d="M0 -6 Q0 0 6 0 Q0 0 0 6 Q0 0 -6 0 Q0 0 0 -6 Z" fill="var(--muted)" /></g>

  <!-- gato -->
  <g fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 850 330 L 1120 330" stroke="var(--line)" stroke-dasharray="2 8" />

    <path class="tail" d="M 1022 322 Q 1082 326 1084 284 Q 1086 252 1060 248" />

    <path d="M 924 220 Q 888 262 892 330 L 1028 330 Q 1032 262 996 220" fill="var(--card)" />
    <path d="M 926 330 Q 926 312 942 312 Q 958 312 958 330" />
    <path d="M 962 330 Q 962 312 978 312 Q 994 312 994 330" />

    <path d="M 898 150 L 902 86 L 942 116 Q 960 110 978 116 L 1018 86 L 1022 150 Q 1032 202 990 222 Q 960 232 930 222 Q 888 202 898 150 Z" fill="var(--card)" />
    <path d="M 910 106 L 912 128 L 926 118" stroke-width="2" stroke="var(--muted)" />
    <path d="M 1010 106 L 1008 128 L 994 118" stroke-width="2" stroke="var(--muted)" />

    <g stroke-width="2" stroke="var(--muted)">
      <path d="M 904 184 L 866 178" /><path d="M 904 194 L 864 197" />
      <path d="M 1016 184 L 1054 178" /><path d="M 1016 194 L 1056 197" />
    </g>

    <path d="M 960 188 Q 954 198 946 193 M 960 188 Q 966 198 974 193" stroke-width="2.5" />
  </g>
  <ellipse class="eye" cx="937" cy="164" rx="6" ry="8" fill="var(--fg)" />
  <ellipse class="eye" cx="983" cy="164" rx="6" ry="8" fill="var(--fg)" />
  <path d="M 954 180 L 966 180 L 960 187 Z" fill="var(--accent)" />
  <circle cx="921" cy="188" r="8" fill="var(--accent)" opacity=".22" />
  <circle cx="999" cy="188" r="8" fill="var(--accent)" opacity=".22" />
</svg>
